name: Verify acceptance invocation boundaries
on:
  push:
    branches: [feat/phase4-native-acceptance]
    paths: ['.github/workflows/phase4-boundary-review.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'CompleteDotTech/jev-factorio-agent' && github.ref == 'refs/heads/feat/phase4-native-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python .github/phase4-boundary-review.py
      - name: Prepare exact local source identity without publishing
        run: |
          set -euo pipefail
          git rm .github/phase4-boundary-review.py .github/workflows/phase4-boundary-review.yml
          git add src/jev_factorio/acceptance_capture.py src/jev_factorio/native_acceptance.py tests/test_native_acceptance.py tests/test_acceptance_review.py docs/NATIVE_ACCEPTANCE.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Require exact source fingerprint and uninterrupted process identity for native trials'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/test_native_acceptance.py tests/test_dev_probe_lua.py tests/test_acceptance_review.py tests/test_acceptance_invocation.py -q
      - run: python -m pytest tests/ --ignore=tests/test_dashboard_browser.py -q
      - run: python -m compileall -q src
      - name: Publish only the exact passing commit
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH=feat/phase4-native-acceptance
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/$BRANCH
