name: Verify Mission Control missing-state freshness
on:
  push:
    branches: [staging/mission-control-verified-20260924]
    paths: ['.github/workflows/mission-control-freshness.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'CompleteDotTech/jev-factorio-agent' && github.ref == 'refs/heads/staging/mission-control-verified-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply bounded correction and verify exact tested tree
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/jev_factorio/dashboard.py');s=p.read_text()
          old='''            view.pop("mission_record", None)
                      view["state_observed_time"] = event["time"]
          '''
          new='''            view.pop("mission_record", None)
                      # A truncated/older record cannot rejuvenate a previous observation.
                      recorded_state = data["record"].get("state")
                      view["state"] = recorded_state if isinstance(recorded_state, dict) else {}
                      view["state_observed_time"] = event["time"] if view["state"] else None
          '''
          assert s.count(old)==1;s=s.replace(old,new,1)
          old='if key in RECORD_KEYS or key in {"state", "mission_record"}})'
          assert s.count(old)==1;p.write_text(s.replace(old,'if key in RECORD_KEYS or key == "mission_record"})'))
          p=Path('tests/test_dashboard_mission.py')
          p.write_text(p.read_text()+'''

          @pytest.mark.parametrize('missing_state', [None, [], 'truncated'])
          def test_incomplete_decision_record_cannot_reuse_or_rejuvenate_prior_launch_state(tmp_path, missing_state):
              path = tmp_path / 'events'
              with EventWriter(path) as writer:
                  writer.emit('observation', 2, state=project_state(mission_state()))
                  monitor = Monitor(path); monitor.poll()
                  assert monitor.view['state']['mission']['launch']['evidence_valid']
                  record = {'action': 'observe', 'mission_record': {'tick': 1001}}
                  if missing_state is not None:
                      record['state'] = missing_state
                  writer.emit('decision_recorded', 7, record=record)
                  monitor.poll()
                  assert monitor.view['state'] == {}
                  assert monitor.view['state_observed_time'] is None
          ''')
          PY
          git rm .github/workflows/mission-control-freshness.yml
          git add src/jev_factorio/dashboard.py tests/test_dashboard_mission.py
          git diff --cached --check
          test "$(git write-tree)" = 8ce3b73edb328e95cd307d927c0b7641f634eeaf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Clear prior observation when a decision event lacks complete state'
      - run: python -m pip install -e '.[test,dashboard-test]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_dashboard.py tests/test_dashboard_integration.py tests/test_dashboard_mission.py tests/test_dashboard_browser.py -q
      - run: python -m pytest tests/ -q
      - run: python -m compileall -q src
      - name: Publish only the passing exact-source correction
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH=staging/mission-control-verified-20260924
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/$BRANCH
