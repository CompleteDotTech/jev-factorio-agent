name: Stage ore-side successors
on:
  push:
    branches: [feat/phase3-ore-side-successors]
    paths: ['.github/phase3-integrate.py', '.github/workflows/phase3-stage.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'CompleteDotTech/jev-factorio-agent' && github.ref == 'refs/heads/feat/phase3-ore-side-successors'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python .github/phase3-integrate.py
      - run: python -m pip install -e '.[test]'
      - name: Successor construction, provenance and restart regressions
        run: python -m pytest tests/test_successors.py tests/test_successors_lua.py tests/test_production_sites.py tests/test_input_route_integration.py tests/test_input_routes_lua.py -q
      - name: Full offline regression suite
        run: python -m pytest tests/ --ignore=tests/test_dashboard_browser.py -q
      - run: python -m compileall -q src
      - name: Commit only tested integration to its feature branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH=feat/phase3-ore-side-successors
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git rm .github/phase3-integrate.py .github/workflows/phase3-stage.yml
          git add src/jev_factorio tests/test_successors.py tests/test_successors_lua.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate separately owned successor production with paid flow and downstream-use gates'
          git push origin HEAD:refs/heads/$BRANCH
