name: Verify successor lifecycle boundaries
on:
  push:
    branches: [feat/phase3-ore-side-successors]
    paths: ['.github/phase3-hardening.py', '.github/phase3-review.py', '.github/workflows/phase3-review.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'CompleteDotTech/jev-factorio-agent' && github.ref == 'refs/heads/feat/phase3-ore-side-successors'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python .github/phase3-hardening.py && python .github/phase3-review.py
      - run: python -m pip install -e '.[test]'
      - name: Focused successor and native-adapter fixture tests
        run: python -m pytest tests/test_successors.py tests/test_successors_lua.py tests/test_successor_lifecycle_guards.py tests/test_successor_review.py tests/test_production_sites.py tests/test_input_route_integration.py -q
      - name: Full offline suite
        run: python -m pytest tests/ --ignore=tests/test_dashboard_browser.py -q
      - run: python -m compileall -q src
      - name: Link public capability documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in ('README.md','docs/PLANNING_AUTONOMY.md'):
              p=Path(path)
              link='docs/ORE_SIDE_SUCCESSORS.md' if path=='README.md' else 'ORE_SIDE_SUCCESSORS.md'
              p.write_text(p.read_text()+'\n## Ore-side successors\n\nThe opt-in [ore-side successor lifecycle]('+link+') adds separately owned\nproduction, paid construction, native flow checks and bounded downstream-use\nqualification without replacing the established factory. Development VM\nvalidation and production cutover remain separate gates.\n')
          PY
      - name: Publish tested corrections and remove branch-only integration files
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH=feat/phase3-ore-side-successors
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git rm .github/phase3-hardening.py .github/phase3-review.py .github/workflows/phase3-review.yml
          git add src/jev_factorio tests/test_successors.py tests/test_successors_lua.py README.md docs/PLANNING_AUTONOMY.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Guard successor activation, construction stock, sampled liveness and supervisor continuity'
          git push origin HEAD:refs/heads/$BRANCH
