name: Stage bounded planning review
on:
  push:
    branches: [fix/bounded-planning-audit-20260924]
    paths: [.github/workflows/stage-planning-review.yml]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'CompleteDotTech/jev-factorio-agent' && github.ref == 'refs/heads/fix/bounded-planning-audit-20260924'
