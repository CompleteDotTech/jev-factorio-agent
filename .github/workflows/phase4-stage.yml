name: Verify native acceptance tooling
on:
  push:
    branches: [feat/phase4-native-acceptance]
    paths: ['.github/workflows/phase4-stage.yml', '.github/phase4-integrate.py']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'CompleteDotTech/jev-factorio-agent' && github.ref == 'refs/heads/feat/phase4-native-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python .github/phase4-integrate.py
      - run: python -m pip install -e '.[test]'
      - name: Capture, preflight, model-equivalence and gate regressions
        run: python -m pytest tests/test_native_acceptance.py tests/test_dev_probe_lua.py -q
      - name: Full offline regression suite
        run: python -m pytest tests/ --ignore=tests/test_dashboard_browser.py -q
      - run: python -m compileall -q src
      - name: Publish tested integration without retaining write workflow
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH=feat/phase4-native-acceptance
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git rm .github/phase4-integrate.py .github/workflows/phase4-stage.yml
          git add src/jev_factorio/controller.py src/jev_factorio/lua/factory.lua src/jev_factorio/acceptance_capture.py src/jev_factorio/dev_preflight.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate same-observation acceptance metadata and keep model state unchanged'
          git push origin HEAD:refs/heads/$BRANCH
