name: Stage phase two production service
on:
  push:
    branches: [feat/phase2-safe-production-service]
    paths: ['.github/workflows/phase2-stage.yml', '.github/phase2-survey.fragment']
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'CompleteDotTech/jev-factorio-agent' && github.ref == 'refs/heads/feat/phase2-safe-production-service'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply integration against exact source blobs
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {
              'src/jev_factorio/lua/input_routes.lua': 'ab6026ae0fafdc4504524bdbdc270e93a0f6b989',
              'src/jev_factorio/planning/ready_work.py': '645ae018e8b7de613acae5bba449ea436ed461df',
              'src/jev_factorio/planning/output_buffers.py': 'd4d81ae33fb1fa3513a36be6ad2ba91539ce34ce',
              'tests/test_demand_service.py': '7d69b957ac9700622525679b0a3c4831a800d3f3',
          }
          for path, sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha, path
          def edit(path, old, new):
              p=Path(path);text=p.read_text();assert text.count(old)==1,path
              p.write_text(text.replace(old,new,1))
          edit('src/jev_factorio/planning/ready_work.py',
               '            return [primary]\n        candidates = [primary]',
               '            return [service_visit(self, primary)]\n        candidates = [primary]')
          edit('src/jev_factorio/planning/output_buffers.py',
               '            return [primary]\n        candidates = [primary]',
               '            return [primary] if self._buffer_service else [service_visit(self, primary)]\n        candidates = [primary]')
          edit('tests/test_demand_service.py', "    planner.targets['iron-ore'] = 100\n", "    planner.targets['iron-ore'] = 100\n    # The fixture changed inventory after compilation; recapture its new boundary.\n    planner.ledger = SupplyLedger.capture(state, data)\n")
          p=Path('tests/test_phase2_automation.py')
          p.write_text(p.read_text()+'''

          def test_new_inventory_does_not_expand_a_stale_frontiers_spending_budget():
              from jev_factorio.planning.service_policy import carried_stock
              state, _, _, planner, _ = visit_fixture()
              state.inventory['iron-ore'] = 80
              assert carried_stock(planner)['iron-ore'] == 20


          @pytest.mark.parametrize('value', [True, -1, float('nan'), float('inf')])
          def test_invalid_carried_ledger_values_cannot_authorize_service(value):
              from jev_factorio.planning.service_policy import carried_stock
              _, _, planner, _ = lab_fixture()
              planner.ledger.carried['green'] = value
              assert carried_stock(planner).get('green', 0) == 0


          def test_fractional_reservations_round_down_instead_of_borrowing():
              from jev_factorio.planning.service_policy import carried_stock
              state, data, planner, _ = lab_fixture()
              planner.ledger = SupplyLedger.capture(state, data, reserved={'green': 0.5})
              assert carried_stock(planner)['green'] == 19


          def test_cached_survey_is_marked_stale_after_source_moves(tmp_path):
              execute(\'''resources={};storage.campaign.observe();game.tick=game.tick+1
                  source.position={x=20,y=0}
                  local d=storage.campaign.observe().input_routes.diagnostics["recipe:iron-plate"]
                  assert(d.reason=="stale_source_evidence" and placements==0)
              \''', tmp_path)
          ''')
          p=Path('src/jev_factorio/lua/input_routes.lua');text=p.read_text()
          first=text.index('local function path(');last=text.index('local function parameters(',first)
          text=text[:first]+Path('.github/phase2-survey.fragment').read_text()+text[last:]
          old='                if ok then cell=offer; r.offers[source]=offer end'
          new='''                if ok then cell=offer; r.offers[source]=offer
                          else
                              local detail=r.survey_diagnostics and r.survey_diagnostics[source]
                              if detail then detail.reason="survey_evidence_invalid" end
                          end'''
          assert text.count(old)==1;text=text.replace(old,new)
          first=text.index('    for _,role in ipairs(',text.index('r.observer=function()'))
          last=text.index('    result.input_routes=',first)
          diagnostic='''    for _,role in ipairs({"recipe:iron-plate","recipe:copper-plate"}) do
                  local source=campaign.entities[role];local out=output.cells[role]
                  local saved=r.survey_diagnostics and r.survey_diagnostics[role]
                  local detail={}
                  for k,v in pairs(saved or {}) do detail[k]=v end
                  local reason=detail.reason or "survey_not_due"
                  if rows[role] then
                      reason=rows[role].state=="fault" and "route_fault" or
                          (r.cells[role] and "owned_route" or "route_available")
                  elseif not source or not source.valid then reason="producer_missing"
                  elseif storage.mining_outposts and storage.mining_outposts.cells[ores[role]] then
                      reason="outpost_conflict"
                  elseif not out or not out.flow or out.fault then reason="output_not_commissioned"
                  elseif saved and (saved.source_unit~=source.unit_number or saved.output_layout~=out.layout
                          or not saved.source_position or not same(saved.source_position,source.position)) then
                      reason="stale_source_evidence"
                  end
                  detail.reason=reason;detail.fallback="batched_manual_supply"
                  detail.max_belts=max_belts;detail.survey_radius=40;detail.observed_tick=game.tick
                  detail.cached=saved~=nil and saved.survey_tick~=game.tick
                  detail.next_survey_tick=r.last_survey and r.last_survey[role] and r.last_survey[role]+300 or game.tick
                  diagnostics[role]=detail
              end
          '''
          p.write_text(text[:first]+diagnostic+text[last:])
          p=Path('docs/PLANNING_AUTONOMY.md')
          p.write_text(p.read_text()+'\n## Phase 2 implementation\n\nSee [Phase 2 safe production](PHASE2_SAFE_PRODUCTION.md) for deadline-aware\npaid service visits and bounded rotating retrofit surveys. Native VM validation\nand additive successor production remain separate gates.\n')
          PY
      - run: python -m pip install -e '.[test]'
      - name: Focused phase-two and continuity tests
        run: python -m pytest tests/test_phase2_automation.py tests/test_demand_service.py tests/test_input_routes_lua.py -q
      - name: Full offline regression suite
        run: python -m pytest tests/ --ignore=tests/test_dashboard_browser.py -q
      - run: python -m compileall -q src
      - name: Commit tested integration and remove temporary staging files
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH=feat/phase2-safe-production-service
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git rm .github/phase2-survey.fragment .github/workflows/phase2-stage.yml
          git add src/jev_factorio/lua/input_routes.lua src/jev_factorio/planning/ready_work.py src/jev_factorio/planning/output_buffers.py docs/PLANNING_AUTONOMY.md tests/test_demand_service.py tests/test_phase2_automation.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate bounded retrofit surveys and paid service visits; preserve continuity'
          git push origin HEAD:refs/heads/$BRANCH
