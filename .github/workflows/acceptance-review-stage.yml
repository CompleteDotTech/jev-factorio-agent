name: Verify acceptance review fixes
on:
  push:
    branches: [fix/native-acceptance-review-gates]
    paths: ['.github/workflows/acceptance-review-stage.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'CompleteDotTech/jev-factorio-agent' && github.ref == 'refs/heads/fix/native-acceptance-review-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply exact review-boundary edits
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('src/jev_factorio/native_acceptance.py')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='e482df664f97de847baabcef3512845c0d5991d4'
          def edit(name, old, new):
              p=Path(name);text=p.read_text();assert text.count(old)==1,(name,old[:80])
              p.write_text(text.replace(old,new,1))
          name='src/jev_factorio/native_acceptance.py'
          edit(name,'from .acceptance_capture import verify\n',
               'from .acceptance_capture import verify\nfrom .acceptance_boundaries import final_successor_issues, probe_source_sha256\n')
          edit(name,"    reject(preflight.get('ready_for_coordinated_validation') is not True, 'preflight_not_ready')",
               "    reject(preflight.get('query_sha256') != probe_source_sha256(), 'preflight_query_mismatch')\n    reject(preflight.get('ready_for_coordinated_validation') is not True, 'preflight_not_ready')")
          edit(name,'    qualified_sources, newly_qualified = set(), set()',
               '    qualified_sources, newly_qualified = set(), set()\n    observed_successor_sources: set[str] = set()')
          edit(name,'    goal_tick = None\n','    goal_tick = None\n    goal_evidence_regressed = False\n')
          edit(name,"            if goal_tick is None and goal_observed(trial['goal'], state, row):",
               "            observed_goal = goal_observed(trial['goal'], state, row)\n            if goal_tick is not None and not observed_goal:\n                goal_evidence_regressed = True\n            if goal_tick is not None and trial['goal'].startswith('milestone:'):\n                name = trial['goal'].split(':', 1)[1]\n                if row.get('completed_goals', {}).get(name) != goal_tick:\n                    goal_evidence_regressed = True\n            if goal_tick is None and observed_goal:")
          edit(name,'                    for role, successor in sources(view).items():',
               '                    for role, successor in sources(view).items():\n                        observed_successor_sources.add(role)')
          edit(name,"    reject(len(resolved_models) > 1, 'resolved_model_drift')",
               "    issues.extend(final_successor_issues(initial, final, rows[-1], observed_successor_sources))\n    reject(len(resolved_models) > 1, 'resolved_model_drift')")
          edit(name,'    minimum = 432000 if trial[\'arm\'] == \'soak\' else 108000',
               "    final_goal_mismatch = False\n    if goal_tick is not None and trial['goal'].startswith('milestone:'):\n        name = trial['goal'].split(':', 1)[1]\n        final_tick = final.get('completed_goals', {}).get(name)\n        final_goal_mismatch = type(final_tick) is not int or final_tick != goal_tick\n    reject(final_goal_mismatch, 'final_goal_checkpoint_mismatch')\n    reject(goal_evidence_regressed, 'goal_evidence_regressed')\n    if goal_evidence_regressed or final_goal_mismatch:\n        goal_tick = None  # Inconsistent evidence cannot shorten a trial or earn timing credit.\n    minimum = 432000 if trial['arm'] == 'soak' else 108000")
          edit(name,"            for key in ('initial_save_sha256', 'initial_checkpoint_sha256', 'expected_policy', 'expected_model', 'goal', 'production_vm_uuid'):",
               "            for key in ('initial_save_sha256', 'initial_checkpoint_sha256', 'expected_commit',\n                        'expected_source_sha256', 'expected_policy', 'expected_model', 'goal', 'production_vm_uuid'):")
          edit('tests/test_native_acceptance.py','from jev_factorio.acceptance_io import canonical, load_json, sha256, stable_read',
               'from jev_factorio.acceptance_boundaries import probe_source_sha256\nfrom jev_factorio.acceptance_io import canonical, load_json, sha256, stable_read')
          edit('tests/test_native_acceptance.py',"'query_sha256': 'f' * 64", "'query_sha256': probe_source_sha256()")
          edit('tests/test_acceptance_review.py',"'expected_commit':'baseline' if arm=='baseline' else 'treatment'", "'expected_commit':'same-approved-source'")
          p=Path('tests/test_acceptance_regression_gates.py');text=p.read_text()
          assert text.count('steam_power')==3
          p.write_text(text.replace('steam_power','bootstrap_mining'))
          edit('docs/NATIVE_ACCEPTANCE.md',
               'Use the same instrumented commit for baseline and treatment where possible, with',
               'Use the same instrumented commit and source fingerprint for both arms, with')
          p=Path('docs/NATIVE_ACCEPTANCE.md')
          p.write_text(p.read_text()+'''\n## Post-review consistency requirements\n\nThe matched successor comparison rejects different commits or source fingerprints\nbetween baseline and treatment, even when each arm is internally consistent. Only\nthe declared successor feature flag differs; comparing unrelated code revisions\nrequires a separately designed experiment, not this gate.\n\nThe reported preflight query digest must match this package's fixed UTF-8 probe\nsource. Old, missing or altered query identities cannot pass. This is a consistency\ncheck on reported evidence, not a signature proving which command actually ran.\n\nThe final successor checkpoint is checked against final gameplay project state,\nnative source/predecessor identities, paid input/output component receipts and\nlayouts, and exact use/qualification proofs. Previously owned or observed sources\ncannot disappear at the boundary. A legitimate unplaced acquisition intent is\nnot mistaken for a paid furnace. No checkpoint is repaired to make evidence fit.\n\nAn observed research/victory goal must remain present in subsequent observations.\nMilestone timing must also match the final checkpoint. Withdrawn or changed goal\nevidence fails the trial and cannot earn an early completion time or bypass the\nminimum horizon. These corrections do not change gameplay or authorize deployment.\n''')
          PY
      - name: Commit assembled source locally before exact-source tests
        run: |
          set -euo pipefail
          git rm .github/workflows/acceptance-review-stage.yml
          git add src/jev_factorio/native_acceptance.py tests/test_native_acceptance.py tests/test_acceptance_review.py tests/test_acceptance_regression_gates.py docs/NATIVE_ACCEPTANCE.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Close paired-source, probe, final-ownership and persistent-goal acceptance gaps'
      - run: python -m pip install -e '.[test]'
      - name: Focused acceptance and successor regressions
        run: python -m pytest tests/test_acceptance_regression_gates.py tests/test_native_acceptance.py tests/test_acceptance_review.py tests/test_acceptance_invocation.py tests/test_dev_probe_lua.py tests/test_successors.py -q
      - name: Full offline regression suite
        run: python -m pytest tests/ --ignore=tests/test_dashboard_browser.py -q
      - run: python -m compileall -q src
      - name: Publish only the exact passing commit
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH=fix/native-acceptance-review-gates
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/$BRANCH
