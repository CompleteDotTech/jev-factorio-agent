name: Verify terminal acceptance guards
on:
  push:
    branches: [fix/native-acceptance-review-gates]
    paths: ['.github/workflows/acceptance-terminal-review.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'CompleteDotTech/jev-factorio-agent' && github.ref == 'refs/heads/fix/native-acceptance-review-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply terminal-state review corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          def edit(name, old, new):
              p=Path(name);text=p.read_text();assert text.count(old)==1,(name,old[:80])
              p.write_text(text.replace(old,new,1))
          edit('src/jev_factorio/acceptance_boundaries.py',
               "            if old:\n                fixed = ('anchor', 'predecessor_unit', 'started_tick', 'deadline_tick')",
               "            if old:\n                if old['status'] == 'paused' and not _same(old, project):\n                    issues.add('paused_successor_reactivated')\n                fixed = ('anchor', 'predecessor_unit', 'started_tick', 'deadline_tick')")
          p=Path('src/jev_factorio/acceptance_boundaries.py')
          assert 'def project_history_issues' not in p.read_text()
          p.write_text(p.read_text()+textwrap.dedent('''

          def project_history_issues(initial: dict, records: list[dict], final: dict) -> list[str]:
              """Paused project generations cannot resume during an acceptance trial."""
              previous = initial.get('successor_projects', {})
              issues: set[str] = set()
              for state in [*records, final]:
                  projects = state.get('successor_projects', {})
                  if not isinstance(projects, dict):
                      issues.add('successor_project_history_invalid')
                      continue
                  if not previous.keys() <= projects.keys():
                      issues.add('successor_project_history_missing')
                  for source, old in previous.items():
                      current = projects.get(source)
                      if not isinstance(current, dict) or not isinstance(old, dict):
                          issues.add('successor_project_history_invalid')
                          continue
                      if old.get('status') == 'paused' and not _same(old, current):
                          issues.add('paused_successor_reactivated')
                      if old.get('status') == 'qualified' and current.get('status') != 'qualified':
                          issues.add('qualified_successor_project_regressed')
                      if any(not _same(old.get(k), current.get(k)) for k in
                             ('anchor', 'predecessor_unit', 'started_tick', 'deadline_tick')):
                          issues.add('successor_project_identity_changed')
                      if old.get('source_unit') and not _same(old['source_unit'], current.get('source_unit')):
                          issues.add('successor_project_identity_changed')
                  previous = projects
              return sorted(issues)
          '''))
          name='src/jev_factorio/native_acceptance.py'
          edit(name,'from .acceptance_boundaries import final_successor_issues, probe_source_sha256, successor_history_issues',
               'from .acceptance_boundaries import (final_successor_issues, probe_source_sha256,\n                                    project_history_issues, successor_history_issues)')
          edit(name,'    goal_evidence_regressed = False\n','    goal_evidence_regressed = False\n    goal_confirmed_at_tick = None\n')
          edit(name,"            observed_goal = goal_observed(trial['goal'], state, row)",
               "            observed_goal = goal_observed(trial['goal'], state, row)\n            if observed_goal and goal_tick is not None and tick > goal_tick and goal_confirmed_at_tick is None:\n                goal_confirmed_at_tick = tick")
          edit(name,'    issues.extend(successor_history_issues(rows))',
               '    issues.extend(successor_history_issues(rows))\n    issues.extend(project_history_issues(initial, rows, final))')
          edit(name,"    reject(final_goal_mismatch, 'final_goal_checkpoint_mismatch')",
               "    confirmation_missing = (goal_tick is not None and not trial['goal'].startswith('milestone:')\n                            and goal_confirmed_at_tick is None)\n    reject(confirmation_missing, 'goal_confirmation_missing')\n    reject(final_goal_mismatch, 'final_goal_checkpoint_mismatch')")
          edit(name,'    if goal_evidence_regressed or final_goal_mismatch:',
               '    if goal_evidence_regressed or final_goal_mismatch or confirmation_missing:')
          edit(name,"        'goal_progress_delta': progress, 'runtime_identity': runtimes[0] if runtimes else None,",
               "        'goal_progress_delta': progress, 'runtime_identity': runtimes[0] if runtimes else None,\n        'goal_confirmation_tick': goal_confirmed_at_tick if goal_tick is not None else None,")
          p=Path('docs/NATIVE_ACCEPTANCE.md')
          p.write_text(p.read_text()+'\nA paused project is terminal for this acceptance protocol, including pauses first\nobserved mid-trial; it cannot acquire a new source or become active/qualified.\nAn active project may legitimately pause or qualify. Research/victory completion\nrequires a second retaining observation at a strictly later native tick before\nit earns goal timing or shortens a trial. Repeating the same last-tick snapshot\nis not confirmation. A stopped trial lacking this evidence remains incomplete;\nthe evaluator does not resume gameplay to obtain a passing result.\n')
          PY
      - name: Commit assembled source locally
        run: |
          set -euo pipefail
          git rm .github/workflows/acceptance-terminal-review.yml
          git add src/jev_factorio/acceptance_boundaries.py src/jev_factorio/native_acceptance.py docs/NATIVE_ACCEPTANCE.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep paused projects terminal and require later native goal confirmation'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/test_acceptance_terminal_guards.py tests/test_acceptance_regression_gates.py tests/test_native_acceptance.py tests/test_acceptance_review.py tests/test_acceptance_invocation.py tests/test_dev_probe_lua.py tests/test_successors.py -q
      - run: python -m pytest tests/ --ignore=tests/test_dashboard_browser.py -q
      - run: python -m compileall -q src
      - name: Publish only verified source
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH=fix/native-acceptance-review-gates
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/$BRANCH
