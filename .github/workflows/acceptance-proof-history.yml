name: Verify immutable acceptance proof history
on:
  push:
    branches: [fix/native-acceptance-review-gates]
    paths: ['.github/workflows/acceptance-proof-history.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'CompleteDotTech/jev-factorio-agent' && github.ref == 'refs/heads/fix/native-acceptance-review-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Add nonmutating proof-history consistency checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('src/jev_factorio/acceptance_boundaries.py')
          assert 'def successor_history_issues' not in p.read_text()
          p.write_text(p.read_text()+textwrap.dedent('''

          def successor_history_issues(records: list[dict]) -> list[str]:
              """A matching final pair cannot excuse lost or reassigned prior proof."""
              seen: dict[str, dict] = {}
              issues: set[str] = set()
              for record in records:
                  for label in ('state', 'after_state'):
                      native = record[label].get('factory', {}).get('successors', {})
                      rows = native.get('sources', {}) if isinstance(native, dict) else {}
                      if not isinstance(rows, dict):
                          issues.add('successor_history_invalid')
                          continue
                      if any(old.get('source_unit') and role not in rows for role, old in seen.items()):
                          issues.add('successor_paid_evidence_disappeared')
                      for role, row in rows.items():
                          if not isinstance(row, dict):
                              issues.add('successor_history_invalid')
                              continue
                          old = seen.get(role)
                          if old:
                              if any(not _same(old.get(key), row.get(key)) for key in
                                     ('anchor', 'predecessor_unit', 'started_tick')):
                                  issues.add('successor_identity_history_changed')
                              if old.get('source_unit') and not _same(old['source_unit'], row.get('source_unit')):
                                  issues.add('successor_identity_history_changed')
                              for proof in ('use', 'qualification'):
                                  if old.get(proof) and not _same(old[proof], row.get(proof)):
                                      issues.add('successor_' + proof + '_history_regressed')
                          seen[role] = row  # Read-only references to immutable input records.
              return sorted(issues)
          '''))
          p=Path('src/jev_factorio/native_acceptance.py');text=p.read_text()
          old='from .acceptance_boundaries import final_successor_issues, probe_source_sha256'
          assert text.count(old)==1
          text=text.replace(old,'from .acceptance_boundaries import final_successor_issues, probe_source_sha256, successor_history_issues',1)
          old='    issues.extend(final_successor_issues(initial, final, rows[-1], observed_successor_sources))'
          assert text.count(old)==1
          p.write_text(text.replace(old,old+'\n    issues.extend(successor_history_issues(rows))',1))
          p=Path('tests/test_acceptance_regression_gates.py')
          p.write_text(p.read_text()+textwrap.dedent('''

          @pytest.mark.parametrize('change', ['clear_qualification', 'replace_use', 'missing_source'])
          def test_agreeing_final_boundary_cannot_hide_prior_successor_proof_loss(change):
              from jev_factorio.acceptance_boundaries import successor_history_issues
              checkpoint, record = successor_boundary()
              record['state'] = deepcopy(record['after_state'])
              previous = deepcopy(record)
              current = deepcopy(record)
              row = current['after_state']['factory']['successors']['sources'][GROWTH]
              if change == 'clear_qualification':
                  row['qualification'] = {}; row['phase'] = 'producing'
                  checkpoint['successor_projects'][GROWTH]['status'] = 'active'
                  checkpoint['successor_receipts'][GROWTH]['qualification'] = {}
              elif change == 'replace_use':
                  row['use']['job_id'] = 'replacement-job'
                  row['qualification']['use_job_id'] = 'replacement-job'
                  checkpoint['successor_receipts'][GROWTH]['use'] = deepcopy(row['use'])
                  checkpoint['successor_receipts'][GROWTH]['qualification'] = deepcopy(row['qualification'])
              else:
                  current['after_state']['factory']['successors']['sources'] = {}
              current['successor_projects'] = deepcopy(checkpoint['successor_projects'])
              current['successor_evidence'] = deepcopy(current['after_state']['factory']['successors'])
              original = deepcopy((previous, current, checkpoint))
              if change != 'missing_source':
                  assert not final_successor_issues({}, checkpoint, current, {GROWTH})
              assert successor_history_issues([previous, current])
              assert (previous, current, checkpoint) == original


          def test_unchanged_successor_history_is_valid():
              from jev_factorio.acceptance_boundaries import successor_history_issues
              _, record = successor_boundary()
              record['state'] = deepcopy(record['after_state'])
              assert not successor_history_issues([record, deepcopy(record)])
          '''))
          p=Path('docs/NATIVE_ACCEPTANCE.md')
          p.write_text(p.read_text()+'\nOnce observed, paid successor identities and completed use/qualification proofs\nmust also persist through the trial. Agreement of the final checkpoint and final\nobservation cannot excuse an intervening disappearance or reassigned proof.\n')
          PY
      - name: Commit exact assembled source locally
        run: |
          set -euo pipefail
          git rm .github/workflows/acceptance-proof-history.yml
          git add src/jev_factorio/acceptance_boundaries.py src/jev_factorio/native_acceptance.py tests/test_acceptance_regression_gates.py docs/NATIVE_ACCEPTANCE.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reject proof-history regression even when final successor evidence agrees'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/test_acceptance_regression_gates.py tests/test_native_acceptance.py tests/test_acceptance_review.py tests/test_acceptance_invocation.py tests/test_dev_probe_lua.py tests/test_successors.py -q
      - run: python -m pytest tests/ --ignore=tests/test_dashboard_browser.py -q
      - run: python -m compileall -q src
      - name: Publish exact verified commit
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH=fix/native-acceptance-review-gates
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/$BRANCH
